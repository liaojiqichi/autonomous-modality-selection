schema_version: "2.0"
rule_version: "input-richness-baseline-1.2"
role: auxiliary deterministic baseline, never an AI agent
evaluation_rule_version: "solution-richness-ap-2.0"
objective: predict analytical approaches and explanatory perspectives
capability_deduplication: trim and case-fold
hard_rules:
  ASSET_UNAVAILABLE: exclude unavailable concrete assets
  MODALITY_FORBIDDEN: exclude user-forbidden modalities
  ASSET_EXCEEDS_TOTAL_BUDGET: exclude assets individually over budget
cross_modal_fallback:
  role: auxiliary question-specific feasibility, NOT a richness dimension
  minimum_modalities: 2
  order: increasing size then taxonomy order
evaluation:
  dimensions: [A, P]
  deduplication: annotator-assigned duplicate groups
  quality: independent, not a richness weight
